[package]
name = "jocasta"
version = "0.1.2"
edition = "2024"
rust-version = "1.100"
description = "An orchestration environment around omp threads in a shell of its own"
license = "MIT"
repository = "https://github.com/zhivko-kocev/jocasta"
publish = false
autobins = false
autotests = true
autobenches = false

# The workspace is Jocasta alone; the vendored portable-pty beside it is only the patch below.
[workspace]
members = ["."]
exclude = ["crates/portable-pty"]

# portable-pty with its Windows ConPTY patches (crates/portable-pty/portable-pty.patches.md), kept from the herdr fork
# by 0683: the shell's terminals are made with it. A patch is read from the workspace root only.
[patch.crates-io]
portable-pty = { path = "crates/portable-pty" }

# The product (0629): one package, its modules in src/ beside the TypeScript files they replace until the cutover
# (0628). The library is what both binaries build on; `jocasta-bench` is bench/ and evals/ (0636).
[lib]
path = "src/lib.rs"

[[bin]]
name = "jocasta"
path = "src/main.rs"

[[bin]]
name = "jocasta-bench"
path = "bench/main.rs"

# Test support (0636): the sandbox, temp folders and the clock and environment seams the library's tests use
# (`shared::testing`, `shared::clock::testing`, `shared::env`'s overlay). The package's own dev builds turn it on
# through the self dev-dependency below, so `jocasta-bench`'s tests reach them; a release build leaves them out.
[features]
test-support = []

# The crates of 0631–0640. Versions are the newest at the first lock (0640); .cargo/config.toml holds every later
# addition and bump to the 7-day rule (0627).
[dependencies]
# The shell's terminal grid (0683, its install approval); its terminals come from portable-pty below, not its own tty.
alacritty_terminal = "=0.26.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
chrono = "0.4.45"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
futures-util = "0.3.34"
getrandom = "0.3.4"
globset = "0.4.18"
icalendar = { version = "0.17.17", features = ["recurrence"] }
# The pty under every pane of the shell (0683): the patched copy at crates/portable-pty.
portable-pty = "=0.9.0"
process-wrap = { version = "10.0.1", features = ["std", "tokio1", "job-object", "process-group"] }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls-platform-verifier = "0.7.1"
saphyr = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order: objects keep their keys' order, as JavaScript's do (indexmap is already in the tree).
# float_roundtrip: floats parse exactly, as JavaScript's do; a Windows process start (a FILETIME above 2^53, written
# as a float in service.lock) otherwise reads back one ULP off and a live lock holder looks like another run.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "fs", "signal"] }
tokio-rustls = "0.26.6"
# The bench's feed client (`bench/lib/service_feed.rs`) and the feed's tests.
tokio-tungstenite = "0.29.0"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Wdk_System_Threading",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Credentials",
	"Win32_Storage_FileSystem",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_JobObjects",
	"Win32_System_LibraryLoader",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
jocasta = { path = ".", features = ["test-support"] }
# Reads the Rust sources for tests/tree_checks.rs (0645); the lock's own version, parsing only.
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing", "visit"] }
tokio = { version = "1.54.1", features = ["test-util"] }

# Line tables only for the workspace's own crate and none for dependencies: full debug info made the links and the
# PDBs the heaviest part of a build on his PC. Panics and backtraces still name lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Rust's half of 0610's ceilings: Biome's limits (5 parameters, 120 lines a function, complexity 40, 1000 lines a file
# by review) have clippy twins in clippy.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stderr = "allow"
