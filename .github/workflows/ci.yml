# Type check (0037), lint (0036), knip and the advisory audit (0614) and the tests on windows, ubuntu and macos (plan
# section 7).
# Evals run his real omp and never run here (0384); opt-in smokes (herdr, omp's SDK, dictation) stay off. Read-only
# token; every action is pinned to the commit its tag named when it was pinned.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # Each OS reports its own result (0572): one failing job doesn't cancel the others.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung process tree never holds a runner for GitHub's default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # Dead code, as in `mise run check` (0614); once per run, like the audit.
      - if: matrix.os == 'ubuntu-latest'
        run: bunx knip
      # Fails on high and critical advisories only; it needs the network, so it is not in `mise run check`. Once per run
      # (the advisories don't depend on the OS).
      - if: matrix.os == 'ubuntu-latest'
        run: bun audit --audit-level=high
