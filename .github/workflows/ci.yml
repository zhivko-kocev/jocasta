# Type check (0037), lint (0036) and the tests on windows, ubuntu and macos (plan section 7). Evals run his real omp
# and never run here (0384); opt-in smokes (herdr, Graphiti, omp's SDK, dictation) stay off. Read-only token; every
# action is pinned to the commit its tag named when it was pinned.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
