# The Rust checks (rustfmt, clippy, nextest with the syntax-tree test, cargo-deny, cargo-machete; 0627, 0639, 0644,
# 0645) and the Bun checks that remain (type check (0037), lint (0036), knip and the advisory audit (0614), the tests)
# on windows, ubuntu and macos (plan section 7). Tools: the runners' own rustup, and mise from its official install
# script (0476) at a pinned version, reading the repo's mise.toml and mise.lock (`mise install --locked`: Bun,
# Rust, cargo-deny, cargo-machete, nextest and Zig as pinned there). The herdr fork in crates/herdr builds too; its
# terminal library is compiled with Zig.
# Evals run his real omp and never run here (0384); opt-in smokes (herdr, omp's SDK, dictation) stay off. Read-only
# token; every action is pinned to the commit its tag named when it was pinned.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # Each OS reports its own result (0572): one failing job doesn't cancel the others.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung process tree never holds a runner for GitHub's default six hours; the herdr fork's build from scratch
    # (Zig's libghostty-vt among it) needs more than the 45 minutes the product alone did.
    timeout-minutes: 90
    env:
      # The mise release the install scripts fetch (checked against GitHub's SHASUMS256.txt by the script).
      MISE_VERSION: 2026.10.17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # mise through its official install script (0476); both scripts put mise in ~/.local/bin.
      - name: mise
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://mise.run/powershell | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.local\bin"
      - name: mise
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise install --locked
        shell: bash
      - run: mise exec -- bun install --frozen-lockfile
        shell: bash
      - run: mise exec -- cargo fmt --check
        shell: bash
      - run: mise exec -- cargo clippy --all-targets --locked
        shell: bash
      - run: mise exec -- cargo nextest run --locked --no-fail-fast
        shell: bash
      # The herdr fork's own suite (crates/herdr and its terminal library, built with the workspace's lock: Zig's library
      # and the link on each OS). Two tests that fail upstream too under WSL (crates/herdr/TESTS-BASELINE.md) are left
      # out; on macOS also the two whose python HTTP server in a pane doesn't answer (never seen passing on a macOS
      # runner, cause not found; Jocasta's installer hands off on Linux only).
      - shell: bash
        run: |
          skip='test(=server_survives_hangup_and_logs_why_it_stops) | test(=sigwinch_refreshes_host_palette_without_resizing)'
          if [ "$RUNNER_OS" = macOS ]; then
            skip="$skip | test(=live_handoff_preserves_python_http_server) | test(=live_handoff_preserves_http_servers_across_multiple_sessions)"
          fi
          mise exec -- cargo nextest run -p herdr -p ghostty-vt --locked --no-fail-fast -E "not ($skip)"
      # Needs the network (the advisory database); the same on every OS, as `mise run check` runs it.
      - run: mise exec -- cargo deny --log-level error check
        shell: bash
      # Unused dependencies of Cargo.toml (0645); the manifest alone.
      - run: mise exec -- cargo machete ./Cargo.toml
        shell: bash
      - run: mise exec -- bun run typecheck
        shell: bash
      - run: mise exec -- bun run lint
        shell: bash
      - run: mise exec -- bun run test
        shell: bash
      # Dead code, as in `mise run check` (0614); once per run, like the audit.
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: mise exec -- bunx knip
      # Fails on high and critical advisories only; it needs the network, so it is not in `mise run check`. Once per run
      # (the advisories don't depend on the OS). GHSA-fc5q-39xc-vjpf (picomatch's ReDoS, no fixed release) is ignored
      # until a fix ships: knip matches only the repo's own globs against its own files (0648).
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: mise exec -- bun audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf
