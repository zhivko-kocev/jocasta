# omp is not pinned (0693): once a week, and on demand, the newest omp is checked against Jocasta's seams. mise installs
# the newest omp release (`oh-my-pi@latest`), `mise run omp-seams` looks up every setting Jocasta writes in its
# `omp config list --json`, and the guard test runs its oracle on omp's npm package of the same version (the oracle
# loads omp's own modules; `--any-version`). A break opens one issue "omp <version> breaks a seam" with the log's tail,
# unless an open issue already has that title. mise from its official install script at a pinned version (0476), as in
# ci.yml; every action is pinned to the commit its tag named when it was pinned.
name: omp-latest

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seams:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_VERSION: 2026.10.17
      # mise's GitHub backend lists omp's releases; the token lifts the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: mise
        shell: bash
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - run: mise install --locked
        shell: bash
      - run: mise exec -- bun install --frozen-lockfile
        shell: bash
      - name: The newest omp
        shell: bash
        run: |
          set -euo pipefail
          mise use -g oh-my-pi@latest 2>&1 | tee "$LOGS/install.log"
          version="$(mise exec -- omp --version | sed 's#.*/##')"
          echo "OMP_VERSION=$version" >> "$GITHUB_ENV"
          # The oracle's copy: omp's npm package of the same version, in Bun's global install, outside the repo so
          # its 7-day package rule (bunfig.toml) doesn't refuse a fresh release.
          bun="$(mise which bun)"
          cd "$RUNNER_TEMP"
          "$bun" add -g "@oh-my-pi/pi-coding-agent@$version" 2>&1 | tee -a "$LOGS/install.log"
      - name: omp-seams
        shell: bash
        run: |
          set -euo pipefail
          mise run omp-seams 2>&1 | tee "$LOGS/omp-seams.log"
      - name: The guard on omp's own resolver
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --bin jocasta-bench
          mise exec -- bun test --timeout 30000 test/config/guard.test.ts 2>&1 | tee "$LOGS/guard.log"
          # A skipped oracle test means omp's package didn't load: that is a break too.
          if grep -Eq '^ *[0-9]+ skip' "$LOGS/guard.log"; then echo "the oracle didn't run on omp $OMP_VERSION" >&2; exit 1; fi
      - name: Report the break
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="omp ${OMP_VERSION:-latest} breaks a seam"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "An open issue already says: $title"
            exit 0
          fi
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The weekly omp-latest run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for log in "$LOGS"/*.log; do
              printf '\n### %s\n\n```\n' "$(basename "$log")"
              tail -n 40 "$log"
              printf '```\n'
            done
          } > "$body"
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
