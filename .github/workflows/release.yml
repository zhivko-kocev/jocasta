# Releases on a tag (0051): each target tested, then built on its own platform (0043; CR-07), packaged (0044) with its
# checksum, then one GitHub release. The runner's
# own rustup and mise (its official install script, 0476) read the repo's mise.toml and mise.lock; `mise run build`
# is `cargo build --release --locked` then scripts/build.ts. Each build is checked for what the task ships (the install
# layout, appendix I) and its `jocasta --version` runs before anything is uploaded; `jocasta-bench` is built beside it
# in `dist/<target>/bench/` and stays out of the archive. Only the publish job may write; every action is pinned to the commit its tag named when it was
# pinned.
# Installer integrity (0484): before the release exists, the publish job commits `checksums.sha256` (one sha256sum line
# per archive) on top of the release's tag and pushes that commit as the tag `checksums-<tag>`. install.ps1 and
# install.sh read the expected SHA-256 from that tag on raw.githubusercontent.com, never from the release, so a
# replaced release asset is refused. Tag protection, set once in the repository's settings: a tag ruleset on `v*` and
# `checksums-v*` with "Restrict updates" and "Restrict deletions" and no bypass actors, so neither tag can be moved or
# deleted once pushed (the built-in GITHUB_TOKEN can't be a bypass actor, so creations stay open to anyone with write
# access; that access is outside what this check covers). A rerun of the publish job keeps the checksums tag as first
# pushed and goes on only when it names these very archives.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      # The mise release the install scripts fetch (checked against GitHub's SHASUMS256.txt by the script).
      MISE_VERSION: 2026.10.17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # mise through its official install script (0476); both scripts put mise in ~/.local/bin.
      - name: mise
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://mise.run/powershell | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.local\bin"
      - name: mise
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise install --locked
        shell: bash
      - run: mise exec -- bun install --frozen-lockfile
        shell: bash
      - run: mise exec -- cargo fmt --check
        shell: bash
      - run: mise exec -- cargo clippy --all-targets --locked
        shell: bash
      - run: mise exec -- cargo nextest run --locked
        shell: bash
      - run: mise exec -- bun run typecheck
        shell: bash
      - run: mise exec -- bun run lint
        shell: bash
      - run: mise exec -- bun run test
        shell: bash
      - run: mise run build
        shell: bash
      - name: The build runs and carries what the build task ships
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.target }}"
          exe=""
          [ "${{ matrix.target }}" = windows-x64 ] && exe=".exe"
          "$out/jocasta$exe" --version
          "$out/bench/jocasta-bench$exe" --help >/dev/null
          for part in "jocasta$exe" README.md CHANGELOG.md config/boss-manual.md "bench/jocasta-bench$exe"; do
            [ -e "$out/$part" ] || { echo "$out has no $part" >&2; exit 1; }
          done
          # The archive carries the install layout without the VM's bench binary.
          archive="dist/jocasta-${{ matrix.target }}.tar.gz"
          [ "${{ matrix.target }}" = windows-x64 ] && archive="dist/jocasta-windows-x64.zip"
          tarbin=tar
          [ "${{ matrix.target }}" = windows-x64 ] && tarbin="$SYSTEMROOT/System32/tar.exe"
          if "$tarbin" -tf "$archive" | grep -Eq '^(\./)?bench(/|$)|jocasta-bench'; then echo "$archive carries bench" >&2; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jocasta-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
      - name: Checksums in the repository at checksums-<tag> (0484)
        shell: bash
        run: |
          set -euo pipefail
          tag="checksums-$GITHUB_REF_NAME"
          sums="$RUNNER_TEMP/checksums.sha256"
          cd dist
          for file in *.sha256; do sha256sum -c "$file"; done
          sha256sum *.zip *.tar.gz > "$sums"
          cd ../repo
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
            git show "$tag:checksums.sha256" | cmp - "$sums"
            echo "$tag already names these archives."
            exit 0
          fi
          cp "$sums" checksums.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checksums.sha256
          git commit -m "Checksums for $GITHUB_REF_NAME (0484)"
          git tag "$tag"
          git push origin "refs/tags/$tag"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*.zip dist/*.tar.gz dist/*.sha256
