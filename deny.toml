# cargo-deny in `mise run check` (0639): the crates' advisories, licences and sources, the Rust twin of `bun audit`
# (0614). An advisory or a licence outside this list fails the check.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices with no fixed version: rmcp and icalendar bring chrono in too (0647); herdr's fork (fork plan
# phase 1) brings bincode 2 (its wire protocol) and zbus 5's zvariant crates (Linux notifications), each moved into a
# successor whose upgrade is herdr's to make. Every other advisory still fails the check.
ignore = [
	{ id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, no fix; rmcp and icalendar depend on it (0647)" },
	{ id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, no fix; icalendar depends on it (0647)" },
	{ id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, no fix; herdr's wire protocol depends on it" },
	{ id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (moved into zbus 6); herdr's zbus 5 depends on it" },
	{ id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (moved into zbus 6); herdr's zbus 5 depends on it" },
	{ id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (moved into zbus 6); herdr's zbus 5 depends on it" },
	{ id = "RUSTSEC-2026-0592", reason = "url 2.5.8's origin() on nested blob: URLs; Jocasta calls it only on an http URL it checked. url 2.5.9 is from 2026-11-20 and enters the lock on or after 2026-11-27 (0627's 7 days), dropping this line (fork-build.md row 104)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"CC0-1.0",
	"Unicode-3.0",
	"MPL-2.0",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
	# interprocess's doctest-file and recvmsg (herdr's fork, its local sockets): public-domain-like, no conditions.
	"0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The repo's own path crates (the herdr fork and its ghostty-vt, all `publish = false`) carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
