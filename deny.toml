# cargo-deny in `mise run check` (0639): the crates' advisories, licences and sources, the Rust twin of `bun audit`
# (0614). An advisory or a licence outside this list fails the check.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices with no fixed version: rmcp and icalendar bring chrono in too (0647). Every other advisory
# still fails the check.
ignore = [
	{ id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, no fix; rmcp and icalendar depend on it (0647)" },
	{ id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, no fix; icalendar depends on it (0647)" },
	{ id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained, no fix; async-imap 0.12.0 depends on it (0680)" },
	{ id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, no fix; iced 0.14's text (fontdb, cosmic-text) reads fonts with it (0721)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"CC0-1.0",
	"Unicode-3.0",
	"MPL-2.0",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
