# A heavy thread's omp (0590): the boss started it with `heavy` for ambitious or open-ended work, so it runs on his
# `slow` role, his strongest model, from its plan through its execution and across restarts. Jocasta loads this file
# after the project's overlay, only in a heavy thread's pane. `--model @slow` alone isn't enough: omp 18.18.6's plan
# review starts its "continue with" slider on the `default` tier whatever model planned
# (`modes/interactive-mode.ts:7853-7861`), so the approved plan would run on `default`. Here `default` names his
# `slow` role (a role may name another, `config/model-resolver.ts:1215-1247`), so the slider starts there. Jocasta
# names no model. `@` can't start a plain YAML scalar, hence the quotes.
modelRoles:
  default: "@slow"
