# The boss pane's omp settings (0424): a calm pane. The service starts the boss with `omp --continue --config <this
# file> [--config ~/.jocasta/agent/boss.yml] --config <config>/guard.yml` (0450, 0697), over his
# ~/.omp/agent/config.yml. Keys checked against omp 19.2.0's source (0663, 0690).

# Memory off (0606): omp recalls and retains nothing here; the boss searches past work with `history_search` (0603).
# The boss keeps omp's job widgets (0602): only project and thread panes turn them off. Keys checked against omp
# 19.2.0's source (`memory-backend/settings.ts`).
memory:
  backend: "off"

# Compaction at 200k tokens, a handoff first, whatever his global config says (0399, 0448, 0592, 0677).
compaction:
  methodOrder: [handoff, remote, soft, shake, snapcompact]
  thresholdTokens: 200000
  idleEnabled: true
  idleThresholdTokens: 100000

# The privacy settings, whatever his global config says (0478): no Auto QA reports to qa.omp.sh, no Claude Code
# plugins, web search on DuckDuckGo. Objects merge key by key over his config (his other model roles stay); a list
# replaces his (`disabledProviders`).
dev:
  autoqa: false
disabledProviders: [claude-plugins]
modelRoles:
  # The boss runs on Fable 5.2 at high (0590); his other roles stay his own.
  default: anthropic/claude-fable-5-2:high
  web: web/duckduckgo
  # Dictation's engine (0556): omp's local Parakeet, kept on this machine.
  dictation: local/parakeet-tdt-0.6b-v3

# Dictation through omp's own speech-to-text (0556): Right Ctrl, anywhere, sends `app.stt.toggle`'s key to this pane
# through the shell on press and again on release; the text is sent as soon as recording stops. No fallback model: the
# audio never leaves this machine. Keys checked against omp 19.2.0's source.
stt:
  enabled: true
  submitTrigger: release
retry:
  fallbackChains:
    # The boss's own chain (0590): Opus 5.5 at high, then Opus 5 at high. Objects merge key by key, so his other
    # chains stay.
    default: [anthropic/claude-opus-5-5:high, anthropic/claude-opus-5:high]
    dictation: []

# Thinking hidden.
hideThinkingBlock: true

startup:
  # No welcome screen or startup status lines.
  quiet: true

statusLine:
  # A short status line: the model on the left, cost and context use on the right
  # (segment ids from omp's `default` preset; `custom` reads the two lists below).
  preset: custom
  leftSegments: [model]
  rightSegments: [cost, context_pct]

# Tool output collapsed: omp already shows it collapsed (Ctrl+O expands it); there is no setting
# for it (`toolOutputExpanded: signal(false)`, packages/coding-agent/src/modes/interactive-mode.ts:686 in 19.2.0).

# `/share` would upload a session to omp's public host; its address is a loopback port nothing listens on, so it never
# leaves the machine (0675: the collab relay it once shared with is gone). The collab pins stay as the snapshot has them.
share:
  serverUrl: "http://127.0.0.1:47499/s"
