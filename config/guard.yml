    - { match: "*Git*-c alias.*", approval: deny }
    - { match: "*Git*--config-env*alias.*", approval: deny }
    - { match: "*Git*credential*fill*", approval: deny }
    - { match: "*Git*credential-manager*get*", approval: deny }
    # deny: shapes omp's critical list also matches (a prompt would be silently allowed under yolo, 0450, 0580)
    - { match: "*rm -*r* /*", approval: deny }
    - { match: "*rm -*R* /*", approval: deny }
    - { match: "*--no-preserve-root*", approval: deny }
    - { match: "*shutdown /*", approval: deny }
    - { match: "*| sh", approval: deny }
    - { match: "*| sh *", approval: deny }
    - { match: "*|sh", approval: deny }
    - { match: "*|sh *", approval: deny }
    - { match: "*| bash", approval: deny }
    - { match: "*| bash *", approval: deny }
    - { match: "*|bash", approval: deny }
    - { match: "*|bash *", approval: deny }
    - { match: "*| zsh*", approval: deny }
    - { match: "*|zsh*", approval: deny }
    - { match: "*| fish*", approval: deny }
    - { match: "*<(curl*", approval: deny }
    - { match: "*<(wget*", approval: deny }
    - { match: "*eval $(curl*", approval: deny }
    - { match: "*eval $(wget*", approval: deny }
    - { match: "*sudo rm *", approval: deny }
    # deny: mise trust and global changes (0476); Jocasta checks a repo's trust itself, outside omp
    - { match: "*mise trust*", approval: deny }
    - { match: "*mise use* -g*", approval: deny }
    - { match: "*mise use* --global*", approval: deny }
    - { match: "*mise up* --bump*", approval: deny }
    # prompt: merging a PR on GitHub (Finish asks him itself), and publishing a package or a release (0580)
